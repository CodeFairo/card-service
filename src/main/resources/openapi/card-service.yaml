openapi: 3.0.3
info:
  title: Card Service API
  version: 2.0.0
  description: >
    REST API for managing credit and debit cards.
    - Credit cards: personal and business.
    - Debit cards: associated with one or more bank accounts (ordered by priority).
servers:
  - url: http://localhost:8083/api/v1
    description: Local development

tags:
  - name: CreditCards
    description: Credit card management endpoints
  - name: CreditCardCharges
    description: Endpoints for purchases/consumptions on credit cards
  - name: CreditCardPayments
    description: Endpoints for credit card payments
  - name: DebitCards
    description: Debit card management endpoints
  - name: DebitCardPayments
    description: Endpoints for debit card payments/retiros
  - name: Reports
    description: Reports for last movements of credit/debit cards

paths:
  ##############################
  # CREDIT CARDS
  ##############################
  /creditcards:
    post:
      tags: [CreditCards]
      summary: Create a new credit card
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreditCardRequestDTO' }
      responses:
        '201':
          description: Credit card created successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditCardDTO' }
        '400': { description: Invalid request }

    get:
      tags: [CreditCards]
      summary: List all credit cards
      parameters:
        - in: query
          name: customerId
          schema: { type: string }
        - in: query
          name: cardType
          schema:
            type: string
            enum: [PERSONAL, BUSINESS]
      responses:
        '200':
          description: List of credit cards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CreditCardDTO' }

  /creditcards/{cardId}:
    get:
      tags: [CreditCards]
      summary: Get credit card by ID
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Credit card details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditCardDTO' }
        '404': { description: Card not found }

    delete:
      tags: [CreditCards]
      summary: Cancel a credit card
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Credit card cancelled }
        '404': { description: Card not found }

  /creditcards/{cardId}/balance:
    get:
      tags: [CreditCards]
      summary: Get current balance and available credit
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Credit card balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalanceDTO'

  /creditcards/{cardId}/charges:
    post:
      tags: [CreditCardCharges]
      summary: Register a new credit card consumption
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreditChargeRequestDTO' }
      responses:
        '201':
          description: Charge registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditChargeDTO' }
        '409': { description: Exceeds credit limit }

    get:
      tags: [CreditCardCharges]
      summary: List credit card charges
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of charges
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CreditChargeDTO' }

  /creditcards/{cardId}/payments:
    post:
      tags: [CreditCardPayments]
      summary: Register a credit card payment
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreditPaymentRequestDTO' }
      responses:
        '201':
          description: Payment registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditPaymentDTO' }

    get:
      tags: [CreditCardPayments]
      summary: List credit card payments
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CreditPaymentDTO' }

  /creditcards/{cardId}/movements:
    get:
      tags: [Reports]
      summary: Get last 10 movements (charges + payments) of a credit card
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Last 10 movements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MovementDTO' }

  ##############################
  # DEBIT CARDS
  ##############################
  /debitcards:
    post:
      tags: [DebitCards]
      summary: Create a new debit card
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DebitCardRequestDTO' }
      responses:
        '201':
          description: Debit card created successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebitCardDTO' }

    get:
      tags: [DebitCards]
      summary: List all debit cards
      parameters:
        - in: query
          name: customerId
          schema: { type: string }
      responses:
        '200':
          description: List of debit cards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DebitCardDTO' }

  /debitcards/{cardId}:
    get:
      tags: [DebitCards]
      summary: Get debit card by ID
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Debit card details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebitCardDTO' }
        '404': { description: Card not found }

    delete:
      tags: [DebitCards]
      summary: Cancel or block a debit card
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Debit card cancelled }
        '404': { description: Card not found }

  /debitcards/{cardId}/balance:
    get:
      tags: [DebitCards]
      summary: Get balance of the primary account linked to the debit card
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Balance of primary account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebitBalanceDTO'

  /debitcards/{cardId}/payments:
    post:
      tags: [DebitCardPayments]
      summary: Register a payment (withdrawal) with the debit card
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DebitPaymentRequestDTO' }
      responses:
        '201':
          description: Payment registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebitPaymentDTO' }
        '409': { description: Insufficient balance in all linked accounts }

  /debitcards/{cardId}/movements:
    get:
      tags: [Reports]
      summary: Get last 10 movements of a debit card
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Last 10 debit card movements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MovementDTO' }

components:
  schemas:
    ################ CREDIT ################
    CreditCardRequestDTO:
      type: object
      properties:
        cardType:
          type: string
          enum: [PERSONAL, BUSINESS]
        customerId: { type: string }
        creditLimit: { type: number, format: double }
      required: [cardType, customerId, creditLimit]

    CreditCardDTO:
      type: object
      properties:
        id: { type: string }
        cardType: { type: string }
        customerId: { type: string }
        creditLimit: { type: number, format: double }
        availableCredit: { type: number, format: double }
        outstandingBalance: { type: number, format: double }
        status:
          type: string
          enum: [ACTIVE, CANCELLED, BLOCKED]

    CreditBalanceDTO:
      type: object
      properties:
        cardId: { type: string }
        creditLimit: { type: number }
        availableCredit: { type: number }
        outstandingBalance: { type: number }

    CreditChargeRequestDTO:
      type: object
      properties:
        amount: { type: number, format: double }
        merchant: { type: string }
        description: { type: string }
      required: [amount, merchant]

    CreditChargeDTO:
      type: object
      properties:
        id: { type: string }
        cardId: { type: string }
        amount: { type: number }
        merchant: { type: string }
        description: { type: string }
        chargeDate: { type: string, format: date-time }

    CreditPaymentRequestDTO:
      type: object
      properties:
        amount: { type: number }
        paymentDate: { type: string, format: date-time }
      required: [amount]

    CreditPaymentDTO:
      type: object
      properties:
        id: { type: string }
        cardId: { type: string }
        amount: { type: number }
        paymentDate: { type: string, format: date-time }
        balanceAfter: { type: number }

    ################ DEBIT ################
    DebitCardRequestDTO:
      type: object
      properties:
        customerId: { type: string }
        primaryAccountId: { type: string }
        linkedAccounts:
          type: array
          items: { $ref: '#/components/schemas/AccountLinkDTO' }
      required: [customerId, primaryAccountId]

    DebitCardDTO:
      type: object
      properties:
        id: { type: string }
        customerId: { type: string }
        primaryAccountId: { type: string }
        linkedAccounts:
          type: array
          items: { $ref: '#/components/schemas/AccountLinkDTO' }
        status:
          type: string
          enum: [ACTIVE, BLOCKED, CANCELLED]
        issuedAt: { type: string, format: date }

    AccountLinkDTO:
      type: object
      properties:
        accountId: { type: string }
        priorityOrder: { type: integer }

    DebitBalanceDTO:
      type: object
      properties:
        cardId: { type: string }
        primaryAccountId: { type: string }
        balance: { type: number }

    DebitPaymentRequestDTO:
      type: object
      properties:
        amount: { type: number }
        merchant: { type: string }
        description: { type: string }
      required: [amount]

    DebitPaymentDTO:
      type: object
      properties:
        id: { type: string }
        cardId: { type: string }
        accountUsed: { type: string }
        amount: { type: number }
        paymentDate: { type: string, format: date-time }
        remainingBalance: { type: number }

    ################ COMMON ################
    MovementDTO:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [CHARGE, PAYMENT] }
        cardId: { type: string }
        amount: { type: number }
        description: { type: string }
        date: { type: string, format: date-time }
